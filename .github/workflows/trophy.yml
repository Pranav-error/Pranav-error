name: Generate GitHub Trophies

on:
  schedule:
    - cron: "0 18 * * *"   # runs daily, alongside the 3D contribution graph
  workflow_dispatch:        # allows manual trigger
  # No push trigger — built from the GitHub API, not from anything in this
  # repository, so rebuilding on every commit would only burn CI minutes.
  #
  # Self-hosted because the public github-profile-trophy.vercel.app service
  # (used directly via an <img src=...> before this) went down with
  # DEPLOYMENT_DISABLED (2026-10-08) — a known recurring failure mode for that
  # free-tier service. This generates the same SVG locally instead, so the
  # README no longer depends on a third party's uptime.

permissions:
  contents: write

concurrency:
  group: trophy
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    name: generate-github-trophies

    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          theme: tokyonight
          no-frame: true
          no-bg: true
          margin-w: 6
          column: 7

      - name: Commit and push if changed
        run: |
          git add trophy.svg
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -m "Update GitHub trophies"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected, rebasing and retrying (attempt ${attempt})"
            git pull --rebase origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "still could not push after 5 attempts"
          exit 1
